<!doctype html>
<html>
    <head>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Typst WASM renderer</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }

            body {
                display: flex;
                flex-direction: column;
            }

            #editor {
                width: 100%;
                flex-grow: 1;
                min-height: 0;

                display: flex;

                border-bottom: solid 0.5px;
            }

            #source, #preview {
                height: 100%;
                flex-grow: 1;
                flex-basis: 0;
                width: 0;

                outline: none;
                border: none;
            }

            #source {
                margin: 0;
                padding: 0;

                resize: none;

                font-size: 1.7em;

                font-family: monospace;

                border-right: solid 0.5px !important;
            }

            #preview {
                object-fit: scale-down;
                min-height: 0;
            }

            #wide-controls {
                height: 1cm;
                align-items: center;
                justify-content: center;
                display: flex; /* probably not the right way to implement this but it works */
                flex-shrink: 0;
            }

            .wide-button {
                width: 100%;
                height: 1cm;
                margin: 0;
                padding: 0;
                border: 0;
                flex-shrink: 0;
            }

            #diagnostics {
                background-color: #ffe8e8;
                padding: 0.2cm;
                font-family: monospace;
                display: none;
                flex-shrink: 0;
            }
            #wide-controls > label {
                margin-left: 0.2cm;
            }
            #wide-controls > input:not(:first-child) {
                margin-left: 0.7cm;
            }
            #wide-controls > button {
                margin-left: 0.7cm;
                height: 100%;
                padding: 0 0.3cm;
                border-radius: 0;
                border-width: 0.5px;
                /*border: 0;*/
            }

            #menu {
                z-index: 2;
                position: fixed;
                width: 100%;
                height: 100%;
                background-color: rgb(0 0 0 / 20%);
                backdrop-filter: blur(5px);
            }

            #menu > div {
                position: fixed;
                top: 10%;
                left: 10%;

                background-color: white;
                border: 1px black solid;

                width: calc(80% - 40px);
                height: calc(80% - 40px);
                padding: 20px;

                overflow-y: auto;
            }

            #menu #close-settings {
                width: calc(80% - 40px);
                bottom: calc(10% + 20px);
                height: 1.5cm;
                position: fixed;
            }

            #font-list {
                border-radius: 5pt;
                border: 1px solid black;

                padding: 0.5cm;

                position: relative;
            }

            #font-list>h2 {
                position: absolute;
                top: -0.36cm;
                left: 0.7cm;
                margin: 0;
                padding: 0 0.2cm;
                font-size: 14pt;
                font-weight: 600;
                background-color: white;
            }

            #font-list ul {
                padding: 0;
                border: 1px solid black;
                height: 16em;
                overflow-y: auto;
            }
            #font-list ul>li {
                list-style-type: none;
                padding: 0.1cm;
            }
            #font-list ul>li:nth-child(even) {
                background-color: #ddd;
            }
            #font-list ul a {
                color: blue;
            }

            @media only screen and (max-width: 899px) {
                #preview {
                    display: none;
                }
            }

            @media only screen and (min-width: 1200px) {
                .if-narrow {
                    display: none;
                }
            }
            @media only screen and (max-width: 1199px) {
                #wide-controls {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="editor">
            <textarea
                id="source"
                class="input"
                placeholder="Write something, eg.
"
                spellcheck="false"
            ></textarea>
            <img id="preview" src="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxIiBoZWlnaHQ9IjEiLz4="></img>
        </div>
        <div id="diagnostics">Diagnostics go here</div>
        <div id="wide-controls">
            <input type="checkbox" class="input" id="autosize" checked />
            <label for="autosize">Automatic size</label>
            <input type="checkbox" class="input" id="transparent" />
            <label for="transparent">Make transparent</label>
            <input type="number" class="input" value="7.0" id="px_per_pt" max="20" />
            <label for="px_per_pt">Pixels per point</label>
            <button id="open-settings-wide">More</button>
        </div>
        <button class="wide-button if-narrow" id="open-settings">
            Settings
        </button>
        <div id="menu" hidden>
            <div>
                <h1>Advanced</h1>
                <hr />

                <p>
                    <input type="checkbox" class="input" id="autosize1" checked />
                    <label for="autosize1">Automatic size</label>
                </p>

                <p>
                    <input type="checkbox" class="input" id="transparent1" />
                    <label for="transparent1">Make transparent</label><br />
                </p>

                <p>
                    <input type="number" class="input" value="7.0" id="px_per_pt1" max="20" />
                    <label for="px_per_pt1">Pixels per point</label><br />
                </p>

                <div id="font-list">
                    <h2>Fonts</h2>
                    <div>
                        <ul id="font-list-ul">
                            <!-- These two are builtin -->
                            <li><a href="https://ctan.org/pkg/newcomputermodern?lang=en">New Computer Modern</a></li>
                            <li><a href="https://ctan.org/pkg/newcomputermodern?lang=en">New Computer Modern Math</a></li>
                        </ul>

                        <label for="font-picker">Add font:</label>
                        <input type="file" id="font-picker" accept="font/otf,font/ttf" multiple />
                        <button id="font-picker-add">Add</button>
                    </div>
                </div>

                <p>
                    <button id="close-settings">Close</button>
                </p>
            </div>
        </div>
        <button class="wide-button" id="compile" disabled>
            Loading WASM...
        </button>

        <script>
            // Idk how loading works but this needs to be in its own script to make sure no flickering happens
            (() => {  // we will redefine things below, make sure that we don't pollute socpe
              let textarea = document.querySelector("#source");

              let formulae = [
                  "e^(i pi) + 1 = 0",
                  "integral_C dif omega = integral_(partial C) omega",
                  "(partial u)/(partial t) = nabla^2 u",
                  "F(xi) = integral f(t) e^(-2 pi i xi t) dif t",
                  "(A = B) tilde.eq (A tilde.eq B)",
                  "e^x = sum_n x^n/n!",
                  "n! ~ sqrt(2 pi n) (n/e)^n",
                  "(not phi -> not psi) -> psi -> phi",
              ];

              let formula = formulae[Math.floor(Math.random() * formulae.length)];
              source.placeholder += `$ ${formula} $`;
            })();
        </script>

        <script type="module">
            let worker = new Worker("/worker.js", { type: "module" });

            let button = document.querySelector("#compile");
            let textarea = document.querySelector("#source");
            let preview = document.querySelector("#preview");
            let diagnostics = document.querySelector("#diagnostics");
            let autosize = document.querySelector("#autosize");
            let transparent = document.querySelector("#transparent");
            let px_per_pt = document.querySelector("#px_per_pt");

            let open_settings = document.querySelector("#open-settings");
            let open_settings_wide = document.querySelector("#open-settings-wide");
            let close_settings = document.querySelector("#close-settings");
            let menu = document.querySelector("#menu");

            let font_list_ul = document.querySelector("#font-list-ul");
            let font_picker = document.querySelector("#font-picker");
            let font_picker_add = document.querySelector("#font-picker-add");

            // queue_job will set the queued job parameters, and have it be processed as soon as possible.
            class JobScheduler {
                constructor(worker) {
                    this.worker = worker;
                    this.working = false;

                    this.job_count = 0;
                    this.queued = {};
                    this.queued_count = 0;
                    this.pending_callbacks = {};

                    this.worker.onmessage = (e) => this.handle_response(e);
                }

                check_queue() {
                    if (!this.working && this.queued_count !== 0) {
                        this.working = true;
                        let key = Object.keys(this.queued)[0];
                        let [params, id, cb] = this.queued[key];
                        this.pending_callbacks[id] = cb;
                        this.queued_count -= 1;
                        delete this.queued[key];
                        this.worker.postMessage([params, id]);
                    }
                }

                handle_response(e) {
                    let id = e.data.job_id;
                    this.pending_callbacks[id](e.data);
                    this.working = false;
                    this.check_queue();
                }

                queue_job(params, callback, key = null) {
                    key = key ?? `job${this.job_count}`;
                    if (!(key in this.queued)) this.queued_count += 1;
                    this.queued[key] = [params, this.job_count, callback];
                    this.job_count += 1;

                    this.check_queue();
                }

                queue_job_async(params) {
                    return new Promise((resolve) => this.queue_job(params, resolve));
                }
            };

            // In case of reload
            button.disabled = true;

            button.innerText = "Initialising ...";

            worker.onmessage = () => {
                button.innerText = "Compile (Ctrl+Enter)";
                button.disabled = false;

                function oncompleted(output) {
                    if (output.diagnostics !== undefined) {
                        diagnostics.innerText = output.diagnostics;
                        diagnostics.style.display = "block";
                    } else {
                        diagnostics.style.display = "none";
                        preview.src = output.url;
                    }
                }

                let renderer = new JobScheduler(worker);

                function render_preview() {
                    let visible = window.getComputedStyle(preview, null).display != "none";

                    if (visible) {
                        renderer.queue_job(["render", textarea.value, px_per_pt.value, autosize.checked, transparent.checked], oncompleted, "render");
                    }
                }

                for (let el of document.querySelectorAll(".input")) {
                    el.addEventListener("input", (e) => render_preview());
                }

                function run() {
                    renderer.queue_job(["render", textarea.value, px_per_pt.value, autosize.checked, transparent.checked], (output) => {
                        oncompleted(output);
                        window.location = output.url;
                    });
                }

                button.addEventListener("click", (e) => run());
                textarea.addEventListener("keydown", (e) => {
                    if (e.ctrlKey && e.keyCode === 13) run();
                });

                font_picker_add.addEventListener("click", () => {
                    if (font_picker.files.length < 1) {
                        console.log("select a file");
                        return;
                    }
                    for (const font of font_picker.files) {
                        let reader = new FileReader();
                        reader.onload = async (e) => {
                            let status = await renderer.queue_job_async(["load_font", e.target.result]);
                            console.log("finished loading font, success?", status.success);

                            if (status.success) {
                                // need to add to list of loaded fonts
                                // also need to add to indexeddb or similar

                                let item = document.createElement("li");
                                item.innerText = status.font_family ?? font.name;
                                font_list_ul.appendChild(item);
                            }
                        }
                        console.log("Loading font:", font);
                        reader.readAsArrayBuffer(font);
                    }
                });

                render_preview();
            };

            open_settings.addEventListener("click", () => {
                menu.hidden = false;
            });
            open_settings_wide.addEventListener("click", () => {
                menu.hidden = false;
            });
            close_settings.addEventListener("click", () => {
                menu.hidden = true;
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    menu.hidden = true;
                }
            });

            function sync(name) {
                let normal = document.getElementById(name);
                let other = document.getElementById(name + "1");

                normal.addEventListener("input", () => {
                    other.checked = normal.checked;
                    other.value = normal.value;
                });
                other.addEventListener("input", () => {
                    normal.checked = other.checked;
                    normal.value = other.value;
                });
            }

            sync("autosize");
            sync("transparent");
            sync("px_per_pt");
        </script>
    </body>
</html>
